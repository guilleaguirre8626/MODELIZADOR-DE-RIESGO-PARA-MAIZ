name: Build AgroClima Data Risk v2 Fenologico

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Data Risk v2
        working-directory: datarisk
        run: python build_data_risk.py
      - name: Upload Data Risk results
        uses: actions/upload-artifact@v4
        with:
          name: agroclima-data-risk-v2-fenologico
          path: |
            datarisk/generated/observed_risk_stats_phenology.csv
            datarisk/generated/observed_risk_stats_phenology_upsert.sql
            datarisk/generated/observed_risk_stats.csv
            datarisk/generated/observed_risk_stats_upsert.sql
            datarisk/generated/app_risk_matrix.csv
