<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#123c2b" />
  <title>Modelizador de Riesgo para Maíz</title>
  <link rel="stylesheet" href="./src/styles.css?v=2.9.7" />
</head>
<body>
  <div id="app"><div class="loading">Cargando Modelizador de Riesgo para Maíz...</div></div>

  <script>
    window.addEventListener('error', function (e) {
      const app = document.getElementById('app');
      if (app && app.textContent.includes('Cargando Modelizador de Riesgo para Maíz')) {
        app.innerHTML = '<div style="max-width:620px;margin:60px auto;padding:24px;font-family:Arial,sans-serif;border:1px solid #ddd;border-radius:14px"><h2>Modelizador de Riesgo para Maíz no pudo iniciar</h2><p>Se produjo un error cargando los componentes de la aplicación.</p><p style="color:#666;font-size:14px">' + (e.message || 'Error desconocido') + '</p><button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:8px;background:#123c2b;color:white;cursor:pointer">Reintentar</button></div>';
      }
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script defer src="./src/main.js?v=2.9.7"></script>
</body>
</html>
